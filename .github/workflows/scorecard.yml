# OpenSSF Scorecard — automated supply-chain security posture analysis.
# Publishes results to the public OpenSSF Scorecard API so the README badge
# reflects the project's REAL score (it only populates after the first run on the
# default branch — GATED on the initial push/tag).
name: scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly, so the score tracks drift in the supply-chain posture.
    - cron: "27 4 * * 1"
  push:
    branches: [main]

# Least privilege: only what scorecard needs to read the repo and publish results.
permissions: read-all

# NOTE: this workflow intentionally has NO top-level `env:`/`defaults:` and no
# job-level `env:`. The OpenSSF Scorecard API rejects published results from a
# workflow that defines them (scorecard-action "Workflow Restrictions" /
# scorecard-webapp post_results.go) with HTTP 400, which fails the run. To still
# run on Node.js 24 (Node 20 is deprecated on GitHub runners) we bump the JS
# actions to node24-native versions (checkout@v5) instead of setting
# FORCE_JAVASCRIPT_ACTIONS_TO_NODE24. ci.yml / release.yml are unaffected by this
# restriction and keep that env var.

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # publish results to the OpenSSF API (keyless)
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1 (node24-native; avoids the Node 20 deprecation without a global env)
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.36.2
        with:
          sarif_file: results.sarif
