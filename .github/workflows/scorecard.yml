# OpenSSF Scorecard — automated supply-chain security posture analysis.
# Publishes results to the public OpenSSF Scorecard API so the README badge
# reflects the project's REAL score (it only populates after the first run on the
# default branch — GATED on the initial push/tag).
name: scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly, so the score tracks drift in the supply-chain posture.
    - cron: "27 4 * * 1"
  push:
    branches: [main]

# Least privilege: only what scorecard needs to read the repo and publish results.
permissions: read-all

# Run all JavaScript actions on Node.js 24. Node 20 is deprecated on GitHub
# runners and is forced to Node 24 by default on 2026-06-16; this opts in now and
# becomes a harmless no-op once Node 24 is the default.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # publish results to the OpenSSF API (keyless)
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
