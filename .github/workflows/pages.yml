name: pages

# Build the in-browser receipt verifier (crates/sealchain-wasm) with wasm-pack
# and deploy the static web/ directory to GitHub Pages. The compiled .wasm is
# produced here rather than committed (Scorecard Binary-Artifacts), so web/pkg/
# is git-ignored and regenerated on every deploy.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "crates/sealchain-wasm/**"
      - "crates/apohara-sealchain-core/**"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege (Scorecard Token-Permissions): read-only by default; the deploy
# job alone gets the pages/id-token write scopes.
permissions:
  contents: read

# One deployment at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build verifier wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install wasm-pack
        uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2.82.9
        with:
          tool: wasm-pack

      - name: Build the wasm verifier
        run: wasm-pack build crates/sealchain-wasm --target web --out-dir ../../web/pkg --release

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy the artifact to the Pages site
      id-token: write # OIDC token the deploy-pages action verifies
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
