name: pages

# Build the in-browser receipt verifier (crates/sealchain-wasm) with wasm-pack
# and deploy the static web/ directory to GitHub Pages. The compiled .wasm is
# produced here rather than committed (Scorecard Binary-Artifacts), so web/pkg/
# is git-ignored and regenerated on every deploy.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "crates/sealchain-wasm/**"
      - "crates/apohara-sealchain-core/**"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege (Scorecard Token-Permissions): read-only by default; the deploy
# job alone gets the pages/id-token write scopes.
permissions:
  contents: read

# One deployment at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build verifier wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install wasm-pack
        uses: taiki-e/install-action@0631aa6515c7d545823c67cfae7ef4fc7f490154 # v2.81.8
        with:
          tool: wasm-pack

      - name: Build the wasm verifier
        run: wasm-pack build crates/sealchain-wasm --target web --out-dir ../../web/pkg --release

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy the artifact to the Pages site
      id-token: write # OIDC token the deploy-pages action verifies
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
