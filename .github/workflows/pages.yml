name: pages

# Build the in-browser receipt verifier (crates/sealchain-wasm) with wasm-pack
# and deploy the static web/ directory to GitHub Pages. The compiled .wasm is
# produced here rather than committed (Scorecard Binary-Artifacts), so web/pkg/
# is git-ignored and regenerated on every deploy.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "crates/sealchain-wasm/**"
      - "crates/apohara-sealchain-core/**"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege (Scorecard Token-Permissions): read-only by default; the deploy
# job alone gets the pages/id-token write scopes.
permissions:
  contents: read

# One deployment at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build verifier wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install wasm-pack
        uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: wasm-pack

      - name: Build the wasm verifier
        run: wasm-pack build crates/sealchain-wasm --target web --out-dir ../../web/pkg --release

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # deploy the artifact to the Pages site
      id-token: write # OIDC token the deploy-pages action verifies
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
