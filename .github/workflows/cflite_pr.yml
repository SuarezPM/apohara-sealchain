# ClusterFuzzLite — fuzz code changes on pull requests (Scorecard Fuzzing).
# Runs only on PRs that touch code/fuzz config, so doc-only PRs stay fast and
# main pushes are never gated by fuzzing.
name: ClusterFuzzLite PR fuzzing

on:
  pull_request:
    paths:
      - "crates/**"
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions: read-all

jobs:
  PR:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload fuzzing SARIF to code scanning
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.sanitizer }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - address
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}
      - name: Run fuzzers (${{ matrix.sanitizer }})
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true
