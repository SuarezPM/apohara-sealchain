# Release workflow for apohara-sealchain (no-dist fallback).
#
# If cargo-dist is initialized (see dist-workspace.toml), prefer its generated
# workflow; this is the no-dist fallback.
#
# Triggered on a `v*` tag. Per-OS it builds the release binary for the matching
# target triple and uploads it as a GitHub Release asset. The npx wrapper
# (npx/install.js) downloads these assets by platform/arch.
#
# Third-party actions are pinned to a full commit SHA (Scorecard Pinned-Dependencies)
# with the human-readable version in a trailing comment; Dependabot bumps both.
name: release

on:
  push:
    tags:
      - "v*"

# Least privilege (Scorecard Token-Permissions): read-only at the top level; the
# write scopes a release needs are granted only to the `build` job below.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # `attestations: write` + `id-token: write` let this job mint a SLSA build
    # provenance attestation per asset via Sigstore keyless signing (OIDC);
    # `contents: write` lets it upload the release assets. End users verify with
    # `gh attestation verify <asset> --repo SuarezPM/apohara-sealchain`.
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: apohara-sealchain
            asset: apohara-sealchain-x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: apohara-sealchain
            asset: apohara-sealchain-aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: apohara-sealchain.exe
            asset: apohara-sealchain-x86_64-pc-windows-msvc.exe
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Build release binary
        run: cargo build --release -p apohara-sealchain --target ${{ matrix.target }}

      - name: Stage binary (unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.asset }}

      - name: Stage binary (windows)
        if: runner.os == 'Windows'
        run: copy target\${{ matrix.target }}\release\${{ matrix.bin }} ${{ matrix.asset }}

      # SLSA build provenance for this asset (Sigstore keyless, runner OIDC). The
      # attestation is bound to the asset's digest, so it covers exactly the bytes
      # uploaded below. Verify: gh attestation verify <asset> --repo SuarezPM/apohara-sealchain
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ matrix.asset }}

      # Attach the Sigstore attestation bundle next to the binary so the signature
      # travels with the release (Scorecard Signed-Releases recognizes
      # *.sigstore.json among release assets), in addition to the GitHub
      # attestations API used by `gh attestation verify`.
      - name: Stage attestation bundle as a release asset
        shell: bash
        run: cp "${{ steps.attest.outputs.bundle-path }}" "${{ matrix.asset }}.sigstore.json"

      - name: Upload Release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sigstore.json
          fail_on_unmatched_files: true

  # Publish the two library crates to crates.io. Runs after the binaries build so
  # a tag that does not compile never publishes. `apohara-sealchain` depends on the
  # version-pinned `apohara-sealchain-core`, so core is published first; modern cargo
  # waits for the new version to appear in the index before the dependent publish.
  publish-crates:
    name: publish to crates.io
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: stable
      - name: Publish apohara-sealchain-core, then apohara-sealchain
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          publish() {
            if curl -sf -H "User-Agent: apohara-sealchain-ci" \
                "https://crates.io/api/v1/crates/$1/$ver" >/dev/null 2>&1; then
              echo "$1@$ver already on crates.io — skipping"
            else
              cargo publish -p "$1"
            fi
          }
          # core first; modern cargo waits for it to appear in the index before
          # the dependent bin publish. Re-running a tag is safe (already-published
          # versions are skipped).
          publish apohara-sealchain-core
          publish apohara-sealchain

  # Publish the npx wrapper. It downloads the platform binary from this release,
  # so it runs after the release assets are uploaded (needs: build).
  publish-npm:
    name: publish npx wrapper to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publish npm package
        working-directory: npx
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          if npm view "$name@$ver" version >/dev/null 2>&1; then
            echo "$name@$ver already on npm — skipping"
          else
            npm publish --access public
          fi
