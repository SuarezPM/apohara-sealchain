# CI for apohara-sealchain.
#
# Runs the conformance gate (committed test vectors, no Python required) across
# Linux/macOS/Windows, plus secret scanning (gitleaks) and dependency policy
# (cargo-deny).
#
# NOTE: the interop test (`tests/interop.rs`) is marked `#[ignore]` because it
# needs the local probanza Python venv. It is intentionally NOT run in CI and is
# local-only; `cargo test --workspace` skips ignored tests automatically.
#
# Third-party actions are pinned to a full commit SHA (Scorecard Pinned-Dependencies)
# with the human-readable version in a trailing comment; Dependabot (.github/
# dependabot.yml) bumps both. `dtolnay/rust-toolchain` selects the toolchain via
# the `toolchain:` input because a SHA pin cannot carry the `@stable`/`@1.88` ref.
name: ci

on:
  push:
  pull_request:

# Least privilege (Scorecard Token-Permissions): read-only by default; no CI job
# needs write. Run all JS actions on Node.js 24 (Node 20 is deprecated on GitHub
# runners; forced to Node 24 by default on 2026-06-16 — this opts in early).
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      # Runs the conformance gate (crates/apohara-sealchain-core/tests/conformance.rs).
      # The interop test is #[ignore] and is skipped here on purpose.
      - name: Test workspace
        run: cargo test --workspace

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uses the repo's .gitleaks.toml.
          GITLEAKS_CONFIG: .gitleaks.toml

  verify-offline-isolation:
    # Locks the headline invariant (plan B-1b): the OFFLINE verify path links NO
    # network client. The `verify-only` feature (the wasm in-browser verifier
    # subset) must pull none of reqwest/tokio/sigstore — so `verify` cannot make a
    # network call even by accident. A future edit that drags a network dependency
    # into the verify path breaks this job. (The native Rekor/TSA verify use only
    # offline crypto crates — sigstore-merkle/sigstore-crypto — and the
    # frozen-anchor tests in tests/rekor.rs prove they verify from the receipt plus
    # the pinned shard key alone, with no network.)
    name: verify offline isolation (no network deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
      - name: Assert the verify-only build links no network client
        run: |
          tree="$(cargo tree -p apohara-sealchain-core --no-default-features --features verify-only -e normal)"
          if echo "$tree" | grep -qiE 'reqwest|tokio|sigstore|hyper|tough'; then
            echo "::error::verify-only build pulled a network dependency — the offline verify invariant is broken."
            echo "$tree" | grep -iE 'reqwest|tokio|sigstore|hyper|tough'
            exit 1
          fi
          echo "ok: the verify-only build links no reqwest/tokio/sigstore/hyper"

  deny:
    name: deny (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          # Uses the repo's deny.toml.
          command: check

  msrv:
    # Enforce the workspace MSRV (Cargo.toml `rust-version`). The floor is set
    # by c2pa 0.85 (1.88); see the comment in Cargo.toml. Keep this pin in sync.
    name: msrv (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # rust-toolchain.toml pins `stable` and would override the toolchain this
      # job installs, masking MSRV regressions. Remove it so the 1.88 toolchain
      # below is actually used.
      - name: Drop pinned toolchain override
        run: rm -f rust-toolchain.toml
      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: "1.88"
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: cargo check (workspace) on MSRV
        run: cargo check --workspace --all-targets

  audit:
    # Vulnerability scan of the dependency tree (c2pa/sigstore are large,
    # security-sensitive trees). Documented exceptions live in deny.toml and are
    # mirrored here as --ignore flags. Re-evaluate on each c2pa/sigstore bump.
    name: audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        run: |
          cargo audit \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2024-0370

  provenance-honesty:
    # Honesty gate (plan A-1): the literal "SLSA Build L3" may appear in the docs
    # ONLY once a real release attestation has been verified and that evidence is
    # recorded in docs/SLSA-L3-EVIDENCE.md. Until then the README states the
    # honest "build provenance (L2+)". This blocks over-claiming the provenance
    # level ahead of evidence — the same measure-don't-assert discipline the tool
    # applies to its own layers.
    name: provenance honesty (no unverified L3 claim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Forbid an unverified "SLSA Build L3" claim
        run: |
          if grep -rqF "SLSA Build L3" README.md docs/ 2>/dev/null \
             && [ ! -f docs/SLSA-L3-EVIDENCE.md ]; then
            echo "::error::'SLSA Build L3' is claimed without docs/SLSA-L3-EVIDENCE.md — overclaim blocked."
            exit 1
          fi
          echo "ok: no unverified L3 claim in README/docs"

  bench-smoke:
    # Smoke test for scripts/bench.sh: assert it runs and produces a table. This
    # is NOT a performance gate — no throughput threshold is asserted, so it can
    # never flake on a slow runner. Restricted to push (not every PR): it needs a
    # cold release build of the heavy c2pa/sigstore tree, so gating it to pushes
    # keeps PR CI fast.
    name: bench smoke (no threshold)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build release binary
        run: cargo build --release -p apohara-sealchain
      - name: Run bench smoke (small N) and assert a table was produced
        run: |
          bash scripts/bench.sh 20 256 | tee bench-smoke.md
          grep -qF '| Operation |' bench-smoke.md
