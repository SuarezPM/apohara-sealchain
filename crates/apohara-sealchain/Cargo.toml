[package]
name = "apohara-sealchain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://apohara.dev/sealchain"
documentation = "https://docs.rs/apohara-sealchain"
readme = "../../README.md"
description = "apohara-sealchain MCP server + CLI: verifiable receipts for AI artifacts"
keywords = ["provenance", "c2pa", "sigstore", "attestation", "mcp"]
categories = ["command-line-utilities", "cryptography"]

[[bin]]
name = "apohara-sealchain"
path = "src/main.rs"

[dependencies]
# `version` is required alongside `path` so the published `apohara-sealchain` crate
# resolves `apohara-sealchain-core` from crates.io. Publish order: core FIRST, then bin.
apohara-sealchain-core = { path = "../apohara-sealchain-core", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
hex.workspace = true
# Expand `seal` glob patterns (e.g. `*.png`) when the shell did not. Already in
# the dependency tree transitively, so this adds no new compiled crate.
glob = "0.3"
rmcp = { version = "1.7.0", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "io-std"] }
schemars = "1.2.1"

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
rmcp = { version = "1.7.0", features = ["client", "transport-child-process"] }
tempfile.workspace = true
